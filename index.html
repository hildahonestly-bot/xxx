nity is for, what those people are trying to achieve and where existing spaces fall short. That insight shapes the message, the channels and the reason to join.'],['Give new members a next step','A sign-up is a starting point, not the outcome. People need to know where to begin, what is available to them and how to get involved. Onboarding and relevant programming help turn initial interest into participation.'],['Measure more than membership','A growing member count only tells part of the story. I pay attention to whether people are getting involved, returning, finding useful connections and making progress through the community.']]},experience:{n:'02',title:'Member Experience',lead:'I think about the member journey from the first message to the point where someone feels informed, included and ready to take part. Every touchpoint should make participation easier.',sections:[['Make the first step obvious','A new member should not have to decode the community. A useful welcome explains what the space is for, where to find information and what to do first.'],['Remove the small points of friction','Unanswered questions, scattered information and unclear instructions can stop people from participating. I look at these everyday details and work towards a smoother experience.'],['Pay attention to what members experience','Feedback, recurring questions and participation patterns show where the experience is working and where people are getting stuck. Those signals should shape what happens next.']]},events:{n:'03',title:'Events & Connection',lead:'I see events as a way to bring the right people into the same room around a useful reason to connect. The session matters, but so does what people can take away and who they can stay connected to afterwards.',sections:[['Build around a real audience need','An event should answer a specific need: access to expertise, practical learning, peer exchange or a conversation people cannot easily have elsewhere. That purpose should guide the format and the people invited.'],['Think beyond the event day','The experience begins with the invitation and continues through registration, reminders, hosting and follow-up. Each step affects whether people arrive prepared and feel their time was well spent.'],['Make the next step count','A good event gives people something to do with the connection they have made. Follow-up can help participants continue a conversation, find a resource or stay involved.']]},communication:{n:'04',title:'Communication',lead:'I use communication to keep people informed and involved. Updates should tell members what is happening, why it matters to them and what action they can take.',sections:[['Give every message a job','An announcement, reminder or community update should answer the questions members are likely to have and make the next action easy to find. More messages do not automatically mean better communication.'],['Keep the experience consistent','People may encounter a community through social media, email, an event or a group chat. The information and tone should feel connected wherever they meet the organisation.'],['Treat responses as useful information','Questions, replies and silence can all reveal how a message is landing. I pay attention to those responses and use them to improve what gets communicated next.']]}};

title:'Lefties & Ambidextrous Care Initiative Nigeria',
type:'Advocacy · Education · Community',
lead:'Making room for left-handed and ambidextrous people to learn, work and participate without being asked to change a natural part of who they are.',
image:'lefties-1.png',gallery:['lefties-2.png','lefties-3.png'],
body:'Lefties and Ambidextrous Care Initiative Nigeria (LACI) is a non-governmental organization working to end the forceful switching of left-handed people to right-hand use and the stigma attached to being left-handed. Its work centres on a simple principle: everyone should be able to use their dominant hand without discrimination.',
note:'The organization’s public website and independent reporting were used to expand this project overview. Uche’s specific responsibilities on the project have not been supplied, so this page documents the initiative and its work without assigning unverified duties or outcomes to her.',
sections:[
{heading:'The issue goes beyond which hand a child writes with',text:'Everyday environments are often designed around right-handed use. In classrooms, that can mean desks, scissors, rulers, sharpeners and writing techniques that make ordinary tasks harder for left-handed pupils. The pressure to switch hands can also carry social and emotional consequences, especially when children are corrected, mocked or treated as though their natural preference is a problem. LACI brings attention to these everyday experiences and the need for families, schools and institutions to respond with practical support.'},
{heading:'What the initiative works to change',text:'LACI combines public awareness with education, outreach and advocacy. Its stated work includes community outreach, educating parents and teachers, training educators on how to support left-handed learners, providing information and resources, and advocating for more inclusive schools and workplaces. The organization also describes an Adopt-a-School project that sensitizes stakeholders on nurturing left-handed pupils positively.'},
{heading:'Lefties Expo ’24: taking the conversation into the room',text:'Held in Abuja on 24 July 2024, Lefties Expo ’24 brought together left-handed participants, educators, public officials and advocates. The event featured a goodwill message from Kwara State First Lady Olufolake AbdulRazaq and participation from former FCT Permanent Secretary Olusade Adesola. Discussions addressed the practical barriers left-handed people encounter, including right-handed school materials, scissors, keyboards and other everyday tools, alongside cultural assumptions and stigma.'},
{heading:'From awareness to practical inclusion',text:'The Expo included presentations from international educators and specialists on teaching techniques, the development of a child’s natural handedness and the use of left-handed tools. Participants also unveiled left-handed school materials and equipment, including writing supplies, scissors, rulers, measuring tapes and other classroom and everyday tools. The event called for stronger partnerships with schools, public institutions and community leaders so that awareness can translate into changes in the environments children use every day.'},
{heading:'An ongoing commitment to schools and communities',text:'LACI’s public project information highlights teacher training, advocacy for left-handed students, educational resources and wider acceptance in society. Its website also lists awareness campaigns and community outreach as continuing areas of work. International Left-Handers Day, observed on 13 August, provides an annual moment to bring visibility to the cause and keep the conversation active.'}

},pivot:{title:'Pivot HQ / Pivot Builders Network',type:'Startup ecosystem · Founders · Community',lead:'A community built around the people doing the work of building companies: founders, operators, investors and ecosystem partners.',image:'IMAGE_DATA_REMOVED',gallery:['pivot-2.png'],body:'Pivot HQ is a Lagos-based management consulting and founder-support organization working with early-stage and growth-stage, tech-enabled businesses. Its work brings strategy, operations and execution closer together, helping founders strengthen the systems behind sustainable growth. Its founder community creates room for people building businesses to exchange experience, learn from operators and investors, and develop relationships that can support their next stage.',note:'This photograph captures a community moment at Pivot. The wider Pivot ecosystem has included founder conversations, expert-led sessions and practical learning around business development, operations, finance, leadership and fundraising. Uche’s specific responsibilities and measurable outcomes should be added separately once confirmed.',sections:[{heading:'A room for builders',text:'Founder communities matter because building a company can be isolating. A well-designed room gives people access to peers facing similar decisions, operators with hard-won experience and conversations that move beyond surface-level inspiration.'},{heading:'Learning grounded in the realities of business',text:'Pivot’s public programming has explored the work behind a growing company, including business development, founder leadership, operations and people management, finance, legal compliance and investor readiness. The emphasis is on helping founders strengthen the business itself, not simply its pitch.'},{heading:'Relationships that continue beyond an event',text:'The value of a founder network is often in what happens after the session: a useful introduction, a shared resource, a follow-up conversation or a partnership that develops over time. Pivot’s community programming is designed to make those connections possible.'}],sources:[['Pivot HQ official website','https://pivotheadquarters.com/'],['Pivot HQ on LinkedIn','https://www.linkedin.com/company/pivot-headquarter/'],['Technext: Pivot HQ’s Founders Lab','https://technext24.com/news/pivot-hqs-founders-lab-event-startup/'],['Founders O’Clock','https://selar.com/founders0clock']]},afro:{title:'AfroWomenBizHub',type:'Entrepreneurship · Online community · Women in business',lead:'Growing a digital network of African women entrepreneurs through thoughtful onboarding, useful conversations and access to relevant opportunities.',image:'',body:'At AfroWomenBizHub, I managed a community of more than 200 African women entrepreneurs across WhatsApp and Slack. My work focused on making the community useful beyond the group chat: helping members settle in, encouraging knowledge sharing, connecting people to resources and understanding what members needed from the network.',note:'The community operated across WhatsApp and Slack. The work and engagement described here were delivered through those online spaces.',sections:[{heading:'Building a stronger member experience from the start',text:'I developed and implemented a member onboarding workflow that reduced early member drop-off by 35% within the first two weeks. The aim was to help new members understand how to participate, find relevant conversations and begin getting value from the community sooner.'},{heading:'Turning conversations into consistent participation',text:'I planned and facilitated weekly community conversations, resource-sharing sessions and themed discussions around entrepreneurship, marketing, funding and wellness. These activities contributed to a 50% increase in member participation. I also established regular engagement activities and content touchpoints that encouraged members to share experiences and contribute to discussions.'},{heading:'Making the network useful beyond the platform',text:'I connected members to relevant grants, mentorship programmes and learning resources based on their needs and interests. The focus was on helping members access information and opportunities that could support the businesses they were building.'},{heading:'Using member insight to shape the community',text:'I gathered member feedback, identified recurring needs and shared insights with leadership to inform community programming, content planning and engagement decisions. This helped ensure that the community responded to what members were actually asking for.'},{heading:'Protecting the quality of the space',text:'I maintained a safe and inclusive environment through regular moderation, guideline enforcement and proactive conflict resolution. A useful community depends on trust, and trust requires consistent attention to how people experience the space.'}]}};

    <div><div class="label">02 / About Uche</div><div class="section-title">A little about me.</div></div>
    <div class="work-intro-copy">
      <p>If you're reading this, you probably have a community you're building, growing or trying to get more out of. I'm Uche. I'm a social introvert, easy to work with, and I enjoy working with people towards something that matters. I still spend some of my evenings keeping in touch with communities I've worked with. For me, the relationship doesn't end when a programme does.</p>

      <p>Marketing gave me a more technical way to approach what I already cared about. I became interested in how audience insight, positioning, content and communication can help a community attract the right people, keep them involved, create value for members and contribute to the organisation's growth.</p>

<section class="community-process" id="process">
  <div class="wrap">
    <div class="process-heading">
      <div><div class="label">03 / How I work</div><h2>What happens when you bring me on board?</h2></div>
      <p>From understanding the brief to activating the people around it, this is how I approach the work.</p>
    </div>

function opportunity(kind){let workshops=kind==='workshops';return `<section class="detail-hero wrap"><div class="label">${workshops?'Workshops & learning':'Opportunities & access'}</div><h1>${workshops?'Learning that moves into practice.':'Access changes what becomes possible.'}</h1><p class="detail-lead">${workshops?'I’m interested in workshops that respect people’s time. A useful session gives participants something specific to understand, try or take back to their work.':'I’m interested in the role community can play in making opportunities easier to discover, particularly for people who are not already connected to the right networks.'}</p><a class="back" href="index.html#opportunities">← Back to workshops & opportunities</a></section><section class="wrap"><div class="detail-body"><div><h2>${workshops?'What makes a useful learning space?':'What access can look like'}</h2><p>${workshops?'The strongest learning spaces are built around a real question or challenge. Participants should leave knowing what they have learned, where to apply it and what to explore next.':'Sometimes access starts with information. Sometimes it is an introduction, a useful resource or an invitation into a room where decisions and relationships are forming. Community can help make those entry points more visible.'}</p><p>${workshops?'I pay attention to the balance between what a facilitator shares and what participants get to do. Discussion, exercises and follow-up help turn a session into something people can use.':'My interest is in understanding what people are trying to access, then making the information and connections around those opportunities easier to navigate.'}</p></div><div class="noted">This page can hold workshop recaps, event photographs, session topics and participant feedback. I’ll add individual examples as the relevant details are confirmed.</div></div></section>`}
let q=new URLSearchParams(location.search).get('page');let app=document.getElementById('app');if(!q){app.innerHTML=home()}else if(skills[q]){app.innerHTML=detail(q)}else if(projects[q]){app.innerHTML=project(q)}else if(['workshops','opportunities'].includes(q)){app.innerHTML=opportunity(q)}else{app.innerHTML=home()}

<script>
(() => {
  const carousel = document.querySelector('.portrait-carousel');
  if (!carousel) return;
  const slides = [...carousel.querySelectorAll('.portrait-slide')];
  const dots = [...carousel.querySelectorAll('.portrait-dot')];
  const current = carousel.querySelector('.portrait-current');
  const prev = carousel.querySelector('.portrait-prev');
  const next = carousel.querySelector('.portrait-next');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let active = 0;
  let timer = null;
  const show = (index) => {
    active = (index + slides.length) % slides.length;
    slides.forEach((slide, i) => {
      const selected = i === active;
      slide.classList.toggle('is-active', selected);
      slide.setAttribute('aria-hidden', String(!selected));
    });
    dots.forEach((dot, i) => {
      const selected = i === active;
      dot.classList.toggle('is-active', selected);
      dot.setAttribute('aria-pressed', String(selected));
    });
    current.textContent = String(active + 1).padStart(2, '0');
  };
  const stop = () => { if (timer) window.clearInterval(timer); timer = null; };
  const start = () => {
    stop();
    if (!reducedMotion) timer = window.setInterval(() => show(active + 1), 5200);
  };
  prev.addEventListener('click', () => { show(active - 1); start(); });
  next.addEventListener('click', () => { show(active + 1); start(); });
  dots.forEach(dot => dot.addEventListener('click', () => { show(Number(dot.dataset.go)); start(); }));
  carousel.addEventListener('mouseenter', stop);
  carousel.addEventListener('mouseleave', start);
  carousel.addEventListener('focusin', stop);
  carousel.addEventListener('focusout', start);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  show(0);
  start();
})();
</script>


<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const revealTargets = [
    '.work-intro-content', '.community-fit-heading', '.venn-graphic', '.venn-notes article',
    '.impact-heading', '.impact-stat', '.folders-heading', '.folder-card',
    '.process-heading', '.process-step', '.section-head', '.skill-group',
    '.project-card', '.audio-card', '.professional-direction-inner', '.contact-inner'
  ];
  const elements = [...new Set(revealTargets.flatMap(selector => [...document.querySelectorAll(selector)]))];
  if (elements.length) {
    document.documentElement.classList.add('js-reveal-ready');
    elements.forEach((el, index) => {
      el.classList.add('reveal-on-scroll');
      if (index % 4) el.dataset.revealDelay = String(index % 4);
    });
    if (reduceMotion || !('IntersectionObserver' in window)) {
      elements.forEach(el => el.classList.add('is-visible'));
    } else {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, {threshold: 0.14, rootMargin: '0px 0px -35px 0px'});
      elements.forEach(el => observer.observe(el));
    }
  }

  const counters = [...document.querySelectorAll('.count-up')];
  const animateCount = el => {
    if (el.dataset.counted) return;
    el.dataset.counted = 'true';
    const end = Number(el.dataset.count || 0);
    const prefix = el.dataset.prefix || '';
    const suffix = el.dataset.suffix || '';
    if (reduceMotion) { el.textContent = prefix + end.toLocaleString() + suffix; return; }
    const duration = 1500;
    const start = performance.now();
    const tick = now => {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = prefix + Math.round(end * eased).toLocaleString() + suffix;
      if (progress < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  if ('IntersectionObserver' in window && !reduceMotion) {
    const counterObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateCount(entry.target);
          counterObserver.unobserve(entry.target);
        }
      });
    }, {threshold: 0.5});
    counters.forEach(el => counterObserver.observe(el));
  } else counters.forEach(animateCount);
})();
</script>
